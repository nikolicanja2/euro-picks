name: EURO PICKS EuroLeague refresh

on:
  # GitHub Actions cron uses UTC. Run at both possible UTC hours for
  # midnight in Europe/Belgrade (CET/CEST); worker skips the non-midnight run.
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euro-picks-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests supabase
      - name: Refresh EuroLeague results and player box scores
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python refresh_worker.py
